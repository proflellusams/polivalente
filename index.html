<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada rumo à Nota 1000 — Redação ENEM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:linear-gradient(160deg,#1e1b4b,#312e81 50%,#0f172a);min-height:100vh}
.opt{transition:.15s}.opt:not(:disabled):hover{transform:translateY(-2px);border-color:#fbbf24}
.pop{animation:pop .3s}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
</style>
</head>
<body class="text-slate-800 font-sans p-3 sm:p-6">
<div class="max-w-3xl mx-auto">
  <h1 class="text-center text-white font-extrabold text-2xl sm:text-3xl mb-1">🏆 Jornada rumo à <span class="text-amber-400">Nota 1000</span></h1>
  <p class="text-center text-indigo-200 text-sm mb-4">Treino da Redação do ENEM · Competências C1 a C5</p>
  <div id="app"></div>
  <p class="text-center text-indigo-300 text-xs mt-6">Material de estudo baseado na Matriz de Referência e na Cartilha do Participante (INEP). As notas exibidas são ilustrativas.</p>
</div>

<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEY = 'enemRankingV1';
const getRank = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const setRank = r => { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} };

const TEMA = 'Desafios para o enfrentamento da invisibilidade do trabalho de cuidado realizado pela mulher no Brasil';

/* ---------- FASE 1: monte a redação ---------- */
const BUILD = [
 { step: 'Introdução e Tese', c: 'C2 / C3',
   q: 'Escolha a introdução que contextualiza o tema e apresenta uma tese clara.',
   o: [
    [`Historicamente, a divisão sexual do trabalho atribuiu às mulheres as tarefas domésticas e o cuidado de crianças, idosos e doentes, sem remuneração nem reconhecimento. No Brasil, essa invisibilidade persiste e perpetua desigualdades, o que exige a atuação conjunta do Estado e da sociedade para ser superada.`, true,
     'Contextualiza o tema, assume um ponto de vista claro (tese) e anuncia o caminho dos argumentos. Isso atende ao tipo dissertativo-argumentativo (C2) e a um projeto de texto bem definido (C3).'],
    [`Eu acho que o trabalho de cuidado das mulheres é um problema, mas cada pessoa tem sua opinião e eu respeito todas.`, false,
     'Não defende uma tese: o texto fica neutro e em tom pessoal, sem projeto de texto. A cartilha do INEP pede um ponto de vista claro, defendido ao longo do texto (C3).'],
    [`O desemprego é um dos maiores problemas do Brasil, afetando milhões de pessoas e a economia do país.`, false,
     'Tangencia o tema: fala de desemprego em geral e não do trabalho de cuidado feito por mulheres. Tangenciamento limita bastante a C2, e a fuga total ao tema zera a redação.']
   ] },
 { step: 'Argumento 1 (repertório)', c: 'C2',
   q: 'Qual desenvolvimento usa um repertório sociocultural legitimado, pertinente e produtivo?',
   o: [
    [`Segundo dados do IBGE, as mulheres dedicam, em média, quase o dobro de horas semanais que os homens aos afazeres domésticos e ao cuidado de pessoas. Tal desigualdade mostra que a sobrecarga feminina decorre de uma construção social, e não de aptidão natural, o que restringe o acesso delas ao mercado de trabalho.`, true,
     'O dado vem de fonte reconhecida (IBGE), é pertinente ao tema e foi usado de forma produtiva: o autor o interpreta e o liga à tese. É isso que a C2 valoriza.'],
    [`Como diz o ditado popular, "mulher é quem sabe cuidar da casa", e por isso elas já estão acostumadas com essas tarefas.`, false,
     'Ditado popular é senso comum, não repertório legitimado. Além disso, reforça um estereótipo e naturaliza a desigualdade, indo contra a tese.'],
    [`Vi em um vídeo da internet que muitas mulheres trabalham demais em casa, o que é muito injusto.`, false,
     'A fonte não é identificada nem verificável e o relato é pessoal. Repertório legitimado exige área do saber, obra, dado oficial ou fato histórico reconhecido.']
   ] },
 { step: 'Argumento 2 (aprofundamento)', c: 'C3 / C4',
   q: 'Qual parágrafo traz uma ideia nova, bem encadeada e com relação de causa e consequência?',
   o: [
    [`Além disso, a invisibilidade desse trabalho é agravada pela ausência de políticas públicas, como creches em tempo integral e serviços de cuidado para idosos. Sem esse suporte, o Estado transfere às famílias, sobretudo às mulheres, uma responsabilidade que deveria ser coletiva, o que reforça o ciclo de dependência econômica e de desigualdade de gênero.`, true,
     'Apresenta um novo argumento, explica a causa (falta de políticas públicas) e a consequência (dependência e desigualdade) e usa o conectivo "Além disso" para a progressão (C3 e C4).'],
    [`As mulheres realizam muitas tarefas domésticas, e essas tarefas são realizadas por mulheres em grande quantidade, o que mostra que elas trabalham muito em casa.`, false,
     'É circular: repete o argumento 1 com outras palavras e não avança. Sem progressão de ideias há prejuízo à C3 e à C4.'],
    [`Ademais, o Brasil possui grande extensão territorial e uma rica diversidade cultural, o que torna o país único.`, false,
     'Informação sem relação com a tese. Usar "Ademais" não disfarça o problema: dados soltos e irrelevantes enfraquecem a organização do argumento (C3).']
   ] },
 { step: 'Proposta de Intervenção', c: 'C5',
   q: 'Qual conclusão traz uma proposta com os cinco elementos (agente, ação, meio, finalidade e detalhamento) e respeita os direitos humanos?',
   o: [
    [`Portanto, cabe ao Ministério do Desenvolvimento e Assistência Social, em parceria com os municípios, ampliar a rede pública de creches e centros de cuidado por meio de verbas federais e convênios locais, a fim de redistribuir a responsabilidade do cuidado e garantir autonomia às mulheres. Além disso, campanhas midiáticas devem incentivar a divisão igualitária das tarefas domésticas, para combater estereótipos de gênero.`, true,
     'Agente (Ministério e municípios), ação (ampliar creches e centros de cuidado), meio (verbas e convênios), finalidade (redistribuir o cuidado, garantir autonomia) e detalhamento (campanhas). Proposta completa e respeitosa: nota 200 na C5.'],
    [`Portanto, o governo deve resolver esse problema o mais rápido possível, pois as mulheres merecem respeito.`, false,
     'Agente genérico ("o governo"), nenhuma ação concreta, nenhum meio e nenhum detalhamento. Proposta vaga e pouco articulada à discussão rende nota baixa na C5.'],
    [`Portanto, é necessário que as mulheres abram mão de seus empregos para se dedicar integralmente aos cuidados da casa, solucionando o problema.`, false,
     'Desrespeita os direitos humanos e contradiz a tese. Proposta que fere os direitos humanos zera a C5, independentemente do restante.']
   ] }
];

/* ---------- FASE 2: caça-erros ---------- */
const ERR = { g: 'Desvio gramatical (C1)', f: 'Fuga ao tema (C2)', r: 'Falta de repertório legitimado (C2)', p: 'Proposta de intervenção incompleta (C5)', c: 'Falha de coesão (C4)' };
const HUNT = [
 { c: 'C1', a: 'g', t: `Existe diversas mulheres que acumulam jornadas de trabalho remunerado e doméstico, e a sociedade pouco reconhece esse esforço.`,
   w: 'Erro de concordância verbal: o sujeito "diversas mulheres" está no plural e exige "Existem". Desvios gramaticais reduzem a nota da C1.' },
 { c: 'C2', a: 'f', t: `O uso excessivo de celulares entre adolescentes tem prejudicado o rendimento escolar e as relações familiares, exigindo maior controle dos pais sobre as telas.`,
   w: 'O parágrafo não trata do trabalho de cuidado das mulheres. Desenvolver outro assunto é fuga ao tema, e a fuga total leva a redação à nota zero.' },
 { c: 'C2', a: 'r', t: `Todo mundo sabe que a mulher sempre cuidou da casa, como minha avó já dizia, e por isso essa realidade dificilmente vai mudar.`,
   w: 'Apoia-se em senso comum e experiência pessoal, sem repertório legitimado (dado, obra, fato histórico). Também naturaliza a desigualdade em vez de problematizá-la.' },
 { c: 'C5', a: 'p', t: `Diante do exposto, o governo precisa tomar atitudes para resolver a sobrecarga feminina.`,
   w: 'Há um agente genérico, mas faltam ação específica, meio, finalidade e detalhamento. A C5 avalia os cinco elementos.' },
 { c: 'C4', a: 'c', t: `A sobrecarga feminina limita o acesso ao emprego formal. Entretanto, ela também prejudica a saúde mental das mulheres.`,
   w: '"Entretanto" indica oposição, mas as duas ideias se somam. O conectivo adequado seria "Além disso" ou "Ademais". Conectivo inadequado compromete a C4.' },
 { c: 'C1', a: 'g', t: `A sociedade deve dar um basta à esse problema, que persiste há séculos.`,
   w: 'Erro de crase: não se usa crase antes de pronome demonstrativo masculino ("esse"). O correto é "a esse problema" (C1).' }
];

const QS = [
 ...BUILD.map((b, i) => ({ ph: 1, tag: `Fase 1 · Passo ${i + 1}/4: ${b.step}`, c: b.c, q: b.q, o: sh(b.o), build: true })),
 ...HUNT.map((h, i) => ({ ph: 2, tag: `Fase 2 · Caça-erros ${i + 1}/${HUNT.length}`, c: h.c, q: 'Qual é o principal problema deste trecho de redação?', txt: h.t,
   o: Object.keys(ERR).map(k => [ERR[k], k === h.a, k === h.a ? h.w : 'Não é este o problema principal. ' + 'O erro real: ' + ERR[h.a] + '.']) }))
];

let S = null;

/* ---------- Telas ---------- */
function rankHTML(hl) {
  const r = getRank();
  if (!r.length) return '<p class="text-slate-500 text-sm text-center py-3">Ainda não há pontuações. Seja o primeiro!</p>';
  return '<ol class="space-y-1">' + r.map((e, i) =>
    `<li class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm ${hl === e.id ? 'bg-amber-100 border border-amber-400 font-bold' : 'bg-slate-50'}">
      <span class="w-7 text-center">${['🥇', '🥈', '🥉'][i] || (i + 1) + 'º'}</span>
      <span class="flex-1 truncate">${esc(e.n)}</span>
      <span class="text-xs text-slate-500 hidden sm:inline">${esc(e.d)}</span>
      <span class="text-indigo-700">${e.s} pts</span></li>`).join('') + '</ol>';
}

function home() {
  S = null;
  app.innerHTML = `<div class="pop bg-white rounded-2xl shadow-xl p-5 sm:p-7">
    <div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3 mb-4 text-sm"><b>Tema da missão:</b> ${TEMA}.</div>
    <div class="grid grid-cols-5 gap-1 text-center text-xs mb-4">
      ${[['C1', 'Norma culta'], ['C2', 'Tema e repertório'], ['C3', 'Argumentação'], ['C4', 'Coesão'], ['C5', 'Proposta']].map(c => `<div class="rounded-lg bg-indigo-600 text-white py-2"><b>${c[0]}</b><br><span class="opacity-80">${c[1]}</span></div>`).join('')}
    </div>
    <ul class="text-sm text-slate-600 space-y-1 mb-4 list-disc pl-5">
      <li><b>Fase 1:</b> monte a redação ideal escolhendo o melhor parágrafo em cada etapa.</li>
      <li><b>Fase 2:</b> caça-erros — identifique o problema de cada trecho.</li>
      <li>Você tem <b>3 vidas</b> ❤️. Acertos em sequência dão bônus de pontos. Cada resposta traz o motivo, segundo os critérios do INEP.</li>
    </ul>
    <label class="block text-sm font-semibold mb-1" for="nome">Seu nome no ranking</label>
    <input id="nome" maxlength="20" placeholder="Ex.: Maria S." class="w-full border-2 border-slate-200 rounded-xl px-3 py-2 mb-3 focus:outline-none focus:border-indigo-500">
    <button onclick="start()" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold py-3 rounded-xl text-lg">🚀 Começar a jornada</button>
    <h2 class="font-bold mt-6 mb-2">🏅 Ranking (neste navegador)</h2>${rankHTML()}
    <button onclick="if(confirm('Apagar todo o ranking?')){setRank([]);home()}" class="text-xs text-slate-400 hover:text-red-500 mt-2">Limpar ranking</button>
  </div>`;
}

function start() {
  const n = ($('#nome').value || '').trim() || 'Anônimo';
  S = { n, i: 0, pts: 0, lives: 3, streak: 0, hit: 0, essay: [], lock: false };
  ask();
}

function ask() {
  const q = QS[S.i]; S.lock = false;
  const hearts = '❤️'.repeat(S.lives) + '🖤'.repeat(3 - S.lives);
  app.innerHTML = `<div class="pop bg-white rounded-2xl shadow-xl p-5 sm:p-7">
    <div class="flex justify-between items-center text-sm font-bold mb-2">
      <span>${hearts}</span><span class="text-orange-600">${S.streak >= 2 ? '🔥 x' + S.streak : ''}</span><span class="text-indigo-700">⭐ ${S.pts} pts</span>
    </div>
    <div class="w-full bg-slate-200 rounded-full h-3 mb-1"><div class="bg-gradient-to-r from-amber-400 to-green-500 h-3 rounded-full transition-all" style="width:${(S.i / QS.length) * 100}%"></div></div>
    <p class="text-xs text-slate-500 mb-4">Questão ${S.i + 1} de ${QS.length}</p>
    <span class="inline-block text-xs font-bold bg-indigo-100 text-indigo-700 rounded-full px-3 py-1 mb-2">${q.tag} · ${q.c}</span>
    <h2 class="font-bold text-lg mb-3">${q.q}</h2>
    ${q.txt ? `<blockquote class="bg-amber-50 border-l-4 border-amber-400 rounded p-3 mb-3 italic">“${esc(q.txt)}”</blockquote>` : ''}
    <div class="space-y-2">${q.o.map((o, k) => `<button id="o${k}" onclick="pick(${k})" class="opt w-full text-left border-2 border-slate-200 rounded-xl p-3 text-sm bg-white">${esc(o[0])}</button>`).join('')}</div>
    <div id="fb"></div>
  </div>`;
}

function pick(k) {
  if (S.lock) return; S.lock = true;
  const q = QS[S.i], o = q.o[k], right = q.o.findIndex(x => x[1]);
  q.o.forEach((_, j) => { const b = $('#o' + j); b.disabled = true; b.classList.add('cursor-default'); });
  $('#o' + right).className = 'w-full text-left border-2 border-green-500 bg-green-50 rounded-xl p-3 text-sm';
  let msg;
  if (o[1]) {
    S.streak++; S.hit++;
    const bonus = Math.min(S.streak - 1, 4) * 25; S.pts += 100 + bonus;
    if (q.build) S.essay.push(o[0]);
    msg = `<div class="bg-green-100 border border-green-400 rounded-xl p-3"><b>✅ Correto! +${100 + bonus} pts</b><p class="text-sm mt-1">${esc(o[2])}</p></div>`;
  } else {
    S.streak = 0; S.lives--;
    $('#o' + k).className = 'w-full text-left border-2 border-red-500 bg-red-50 rounded-xl p-3 text-sm';
    msg = `<div class="bg-red-100 border border-red-400 rounded-xl p-3"><b>❌ Não foi dessa vez. −1 vida</b><p class="text-sm mt-1">${esc(o[2])}</p></div>` +
      (q.build ? `<div class="bg-green-100 border border-green-400 rounded-xl p-3 mt-2"><b>Alternativa correta:</b><p class="text-sm mt-1">${esc(q.o[right][2])}</p></div>` : '');
  }
  const last = S.lives <= 0 || S.i >= QS.length - 1;
  $('#fb').innerHTML = `<div class="pop mt-4">${msg}<button onclick="next()" class="mt-3 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl">${last ? 'Ver resultado 🏁' : 'Próxima ➜'}</button></div>`;
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function next() { S.i++; (S.lives <= 0 || S.i >= QS.length) ? end() : ask(); }

function end() {
  const over = S.lives <= 0, pct = S.hit / QS.length;
  const nota = Math.round(pct * 1000 / 40) * 40;
  const bonusVidas = over ? 0 : S.lives * 50; S.pts += bonusVidas;
  const id = Date.now();
  const r = getRank(); r.push({ id, n: S.n, s: S.pts, d: new Date().toLocaleDateString('pt-BR') });
  r.sort((a, b) => b.s - a.s); setRank(r.slice(0, 10));
  const titulo = over ? '📝 Redação rascunhada: tente novamente!' : pct === 1 ? '🏆 Nota 1000 — Mestre da Redação!' : pct >= .8 ? '🥇 Candidato(a) a nota 900+' : pct >= .6 ? '🥈 Quase lá: revise as competências' : '🥉 Bom começo, continue treinando';
  app.innerHTML = `<div class="pop bg-white rounded-2xl shadow-xl p-5 sm:p-7 text-center">
    <h2 class="text-2xl font-extrabold mb-1">${titulo}</h2>
    <p class="text-slate-600 mb-4">${esc(S.n)}, você acertou <b>${S.hit}/${QS.length}</b>${over ? ' e ficou sem vidas.' : ' com ' + S.lives + ' vida(s) restante(s) (+' + bonusVidas + ' pts).'}</p>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-indigo-50 rounded-xl p-3"><div class="text-3xl font-extrabold text-indigo-700">${S.pts}</div><div class="text-xs">pontos no jogo</div></div>
      <div class="bg-amber-50 rounded-xl p-3"><div class="text-3xl font-extrabold text-amber-600">${nota}</div><div class="text-xs">nota ilustrativa (0–1000)</div></div>
    </div>
    ${S.essay.length ? `<details class="text-left bg-slate-50 rounded-xl p-3 mb-4"><summary class="font-bold cursor-pointer">📄 Sua redação montada (${S.essay.length}/4 parágrafos)</summary><div class="space-y-3 mt-3 text-sm">${S.essay.map(p => `<p class="indent-6 text-justify">${esc(p)}</p>`).join('')}</div></details>` : ''}
    <h3 class="font-bold text-left mb-2">🏅 Ranking</h3><div class="text-left">${rankHTML(id)}</div>
    <div class="flex gap-2 mt-5">
      <button onclick="S.n&&restart()" class="flex-1 bg-amber-400 hover:bg-amber-500 font-extrabold py-3 rounded-xl">🔁 Jogar de novo</button>
      <button onclick="home()" class="flex-1 bg-slate-200 hover:bg-slate-300 font-bold py-3 rounded-xl">Início</button>
    </div></div>`;
}

function restart() { S = { n: S.n, i: 0, pts: 0, lives: 3, streak: 0, hit: 0, essay: [], lock: false }; QS.forEach(q => { q.o = sh(q.o); }); ask(); }

home();
</script>
</body>
</html>
