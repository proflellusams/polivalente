<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desafio da Redação — Treino ENEM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#172033}
button,input{font:inherit}
.container{max-width:1050px;margin:auto;padding:20px}
header{background:linear-gradient(135deg,#0f766e,#155e75);color:white;border-radius:24px;padding:28px;margin-bottom:18px;box-shadow:0 10px 30px #0002}
header h1{margin:0 0 8px;font-size:clamp(25px,4vw,40px)}
header p{margin:0;opacity:.9}
.card{background:white;border:1px solid #e3e8ef;border-radius:22px;padding:24px;box-shadow:0 8px 25px #20304012;margin-bottom:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.badge{background:#e6fffb;color:#0f766e;padding:7px 11px;border-radius:999px;font-weight:700;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{background:#f8fafc;border-radius:15px;padding:12px;text-align:center}
.stat strong{display:block;font-size:22px}
.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 20px}
.progress span{display:block;height:100%;background:#14b8a6;transition:.3s}
h2{margin-top:0}
.option,.word,.match-btn{width:100%;text-align:left;border:2px solid #e5e7eb;background:white;border-radius:15px;padding:14px;margin:8px 0;cursor:pointer;transition:.15s}
.option:hover,.word:hover,.match-btn:hover{border-color:#14b8a6;transform:translateY(-1px)}
.option.correct,.word.correct,.match-btn.correct{border-color:#16a34a;background:#f0fdf4}
.option.wrong,.word.wrong,.match-btn.wrong{border-color:#dc2626;background:#fef2f2}
.feedback{margin-top:14px;padding:15px;border-radius:15px}
.good{background:#ecfdf5;border:1px solid #86efac}
.bad{background:#fff1f2;border:1px solid #fda4af}
.next,.primary{border:0;background:#0f766e;color:white;font-weight:800;padding:13px 18px;border-radius:14px;cursor:pointer;margin-top:14px}
.next:hover,.primary:hover{background:#115e59}
.secondary{border:0;background:#e2e8f0;color:#172033;font-weight:700;padding:13px 18px;border-radius:14px;cursor:pointer;margin-top:14px}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small{font-size:14px;color:#64748b}
.example{background:#f8fafc;border-left:5px solid #14b8a6;padding:14px;border-radius:10px;margin:12px 0}
.sequence{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.sequence button{border:2px solid #cbd5e1;background:white;border-radius:12px;padding:12px;cursor:pointer}
.sequence button.selected{border-color:#0f766e;background:#ccfbf1}
.result{text-align:center}
.bigscore{font-size:52px;font-weight:900;color:#0f766e}
@media(max-width:700px){
 .container{padding:12px}
 .homegrid,.choice-row,.stats{grid-template-columns:1fr}
 header{padding:22px}
 .card{padding:18px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎯 Desafio da Redação</h1>
<p>Treine para o ENEM com situações que fazem parte do seu dia a dia.</p>
</header>
<div id="app"></div>
</div>

<script>
const app=document.getElementById('app');

const TEMA="Os impactos do uso excessivo do celular na vida dos adolescentes";
const DADOS=[
{titulo:"🧠 Redação ENEM sem complicação",texto:"Na redação do ENEM, você precisa apresentar uma opinião sobre o tema, explicar essa opinião com bons argumentos e apresentar uma proposta de solução."},
{titulo:"🧱 Estrutura básica",texto:"Uma forma simples de organizar a redação é usar quatro parágrafos: introdução, desenvolvimento 1, desenvolvimento 2 e conclusão."},
{titulo:"🎯 Tese",texto:"A tese é a ideia principal que você vai defender. Ela precisa responder: qual é a minha opinião sobre o problema apresentado?"},
{titulo:"🔎 Argumento",texto:"O argumento explica por que sua opinião faz sentido. Você pode usar fatos, pesquisas, leis, exemplos sociais, livros, filmes ou acontecimentos conhecidos."},
{titulo:"🔗 Conectivos",texto:"Conectivos ajudam o leitor a acompanhar seu raciocínio. Exemplos: além disso, porém, porque, por isso, portanto e dessa forma."},
{titulo:"🛠️ Proposta de intervenção",texto:"Na conclusão, apresente uma solução. Pense em: quem vai agir, o que será feito, como será feito e qual resultado se espera."}
];

const GAMES=[
{tipo:"quiz",titulo:"🎮 Jogo 1 — Qual ideia combina?",q:"Qual frase apresenta uma tese adequada para o tema?",ops:[
["O celular existe há muitos anos e possui vários modelos.",false],
["O uso excessivo do celular pode prejudicar a rotina dos adolescentes, especialmente o sono e a concentração nos estudos.",true],
["Os celulares são vendidos em lojas e pela internet.",false],
["Muitos adolescentes gostam de assistir a vídeos no celular.",false]
],exp:"A alternativa apresenta uma opinião clara e aponta dois problemas que podem ser desenvolvidos: sono e concentração."},

{tipo:"quiz",titulo:"🕵️ Jogo 2 — Caça ao problema",q:"Qual trecho apresenta um problema de linguagem para uma redação formal?",ops:[
["Além disso, o uso excessivo das redes sociais pode diminuir o tempo dedicado aos estudos.",false],
["Porém, muitos estudantes ainda não percebem os efeitos desse hábito.",false],
["Tipo, o celular acaba com a vida da pessoa e é muito ruim, né?",true],
["Por isso, é importante buscar equilíbrio no uso da tecnologia.",false]
],exp:"Expressões como “tipo” e “né”, além do tom exagerado, deixam o trecho inadequado para a linguagem formal da redação."},

{tipo:"quiz",titulo:"🔗 Jogo 3 — Escolha o conectivo",q:"Complete: “O celular facilita a comunicação. ________, quando usado em excesso, pode atrapalhar o sono.”",ops:[
["Além disso",false],["Porém",true],["Portanto",false],["Por isso",false]
],exp:"“Porém” indica oposição: o celular tem uma vantagem, mas também pode trazer um problema quando usado em excesso."},

{tipo:"quiz",titulo:"📚 Jogo 4 — Repertório ou opinião?",q:"Qual opção funciona melhor como repertório para desenvolver uma redação?",ops:[
["Minha mãe acha que celular faz mal.",false],
["Todo mundo sabe que adolescente fica muito no celular.",false],
["Uma pesquisa ou dado de fonte confiável sobre o tempo de uso de telas entre adolescentes.",true],
["Eu vi um comentário em uma rede social.",false]
],exp:"Um repertório forte vem de uma fonte identificável e confiável e precisa ser relacionado ao argumento."},

{tipo:"quiz",titulo:"💡 Jogo 5 — Causa e consequência",q:"Qual alternativa apresenta uma relação de causa e consequência?",ops:[
["Os adolescentes usam celular e também estudam.",false],
["O uso do celular é comum entre os jovens.",false],
["Quando o celular é usado até tarde, o adolescente pode dormir menos e ter dificuldade para se concentrar no dia seguinte.",true],
["Celular, escola, família e internet fazem parte da rotina.",false]
],exp:"A alternativa mostra uma causa (uso até tarde) e consequências (menos sono e dificuldade de concentração)."},

{tipo:"ordem",titulo:"🧩 Jogo 6 — Monte a redação",q:"Clique nos blocos na ordem correta para formar a estrutura básica da redação.",blocos:[
"Introdução: apresentar o tema e a tese.",
"Desenvolvimento 1: explicar o primeiro argumento.",
"Desenvolvimento 2: apresentar outro argumento.",
"Conclusão: propor uma solução."
],exp:"A sequência mais comum é: introdução → desenvolvimento 1 → desenvolvimento 2 → conclusão."},

{tipo:"verdadeiro",titulo:"✅ Jogo 7 — Verdadeiro ou falso",q:"“Na conclusão, basta escrever: ‘O governo precisa resolver esse problema’.”",resposta:false,exp:"Falso. A proposta precisa ser mais detalhada: quem fará, o que será feito, como e com qual finalidade."},

{tipo:"verdadeiro",titulo:"⚡ Jogo 8 — Verdadeiro ou falso",q:"“Uma redação pode ter bons argumentos, mas, se fugir do tema, terá um grande problema na avaliação.”",resposta:true,exp:"Verdadeiro. Compreender e desenvolver corretamente o tema é fundamental."},

{tipo:"quiz",titulo:"📱 Jogo 9 — Situação do dia a dia",q:"João chega da escola, fica várias horas no celular, dorme muito tarde e no dia seguinte não consegue prestar atenção na aula. Qual argumento pode ser usado?",ops:[
["O celular possui várias marcas diferentes.",false],
["O uso sem controle pode prejudicar o sono e a concentração dos estudantes.",true],
["Todo adolescente deveria abandonar a tecnologia.",false],
["A escola não tem nenhuma relação com o problema.",false]
],exp:"O exemplo de João permite discutir o uso sem equilíbrio e seus efeitos na rotina escolar."},

{tipo:"quiz",titulo:"🛠️ Jogo 10 — Complete a solução",q:"Qual proposta é mais completa?",ops:[
["O governo precisa fazer alguma coisa.",false],
["Os adolescentes precisam mudar.",false],
["As escolas devem realizar oficinas sobre uso consciente da tecnologia, com orientações práticas sobre tempo de tela e sono, para ajudar os estudantes a equilibrar estudo e lazer.",true],
["O celular deve ser proibido para todos.",false]
],exp:"A proposta apresenta agente, ação, meio/detalhamento e finalidade, sem propor uma solução exagerada ou inviável."},

{tipo:"quiz",titulo:"✍️ Jogo 11 — Melhor frase",q:"Qual frase é mais adequada para iniciar um desenvolvimento?",ops:[
["Eu acho isso muito ruim.",false],
["Nesse contexto, o excesso de tempo diante das telas pode afetar a organização da rotina escolar.",true],
["Tipo, isso acontece demais.",false],
["Todo mundo concorda comigo.",false]
],exp:"A frase apresenta uma ideia que pode ser desenvolvida com explicações e argumentos e usa linguagem adequada."},

{tipo:"quiz",titulo:"🏁 Jogo 12 — Escolha a conclusão",q:"Qual conclusão fecha melhor uma redação sobre o uso excessivo do celular?",ops:[
["Enfim, foi isso que eu quis dizer.",false],
["Portanto, o uso do celular deve ser equilibrado para que a tecnologia continue sendo útil sem prejudicar a saúde e os estudos dos adolescentes.",true],
["Celular é muito importante e pronto.",false],
["Não tenho mais nada para falar sobre o assunto.",false]
],exp:"A conclusão retoma a ideia principal e apresenta uma direção de solução, mantendo linguagem formal."}
];

let state={fase:0,pontos:0,acertos:0,respondido:false,selecionados:[]};

function home(){
state={fase:0,pontos:0,acertos:0,respondido:false,selecionados:[]};
app.innerHTML=`
<div class="homegrid">
<div class="card">
<div class="badges"><span class="badge">ENEM</span><span class="badge">Português</span><span class="badge">Treino</span></div>
<h2>📱 Tema da missão</h2>
<h3>${TEMA}</h3>
<p>Um tema simples e próximo da realidade dos estudantes. A ideia é aprender a construir argumentos usando situações que eles conhecem: celular, estudos, sono, redes sociais e rotina.</p>
<button class="primary" onclick="aula()">📖 Aprender primeiro</button>
<button class="secondary" onclick="comecar()">🚀 Começar os jogos</button>
</div>
<div class="card">
<h2>🎲 Jogos diferentes</h2>
<p>O treinamento mistura desafios para evitar que a atividade fique repetitiva:</p>
<ul>
<li>Escolha a melhor resposta</li>
<li>Caça ao erro</li>
<li>Complete com conectivos</li>
<li>Monte a estrutura da redação</li>
<li>Verdadeiro ou falso</li>
<li>Situações do cotidiano</li>
<li>Escolha a melhor proposta</li>
</ul>
<div class="example"><b>Objetivo:</b> aprender enquanto joga, errando e entendendo o motivo da resposta.</div>
</div>
</div>`;
}

function aula(){
app.innerHTML=`<div class="card">
<h2>📖 Aula rápida</h2>
<p class="small">Antes de jogar, veja o essencial.</p>
${DADOS.map((d,i)=>`<div class="example"><b>${d.titulo}</b><p>${d.texto}</p>${i===2?'<p><b>Exemplo:</b> “O uso exagerado do celular pode prejudicar a concentração dos estudantes.”</p>':''}</div>`).join('')}
<button class="primary" onclick="comecar()">🎮 Agora quero jogar</button>
<button class="secondary" onclick="home()">⬅ Voltar</button>
</div>`;
}

function comecar(){
state={fase:0,pontos:0,acertos:0,respondido:false,selecionados:[]};
mostrar();
}

function topo(g){
return `<div class="stats">
<div class="stat"><strong>${state.pontos}</strong><span>pontos</span></div>
<div class="stat"><strong>${state.acertos}</strong><span>acertos</span></div>
<div class="stat"><strong>${state.fase+1}</strong><span>questão</span></div>
<div class="stat"><strong>${GAMES.length}</strong><span>total</span></div>
</div>
<div class="progress"><span style="width:${state.fase/GAMES.length*100}%"></span></div>`;
}

function mostrar(){
if(state.fase>=GAMES.length){resultado();return}
state.respondido=false;state.selecionados=[];
const g=GAMES[state.fase];
let body='';
if(g.tipo==="quiz") body=g.ops.map((o,i)=>`<button class="option" onclick="responder(${i})">${o[0]}</button>`).join('');
if(g.tipo==="verdadeiro") body=`<div class="choice-row"><button class="option" onclick="responder(true)">✅ Verdadeiro</button><button class="option" onclick="responder(false)">❌ Falso</button></div>`;
if(g.tipo==="ordem") body=`<p class="small">Clique na sequência correta. Cada bloco selecionado ficará marcado.</p><div id="seq" class="sequence">${g.blocos.map((b,i)=>`<button onclick="selecionar(${i})" id="b${i}">${b}</button>`).join('')}</div><button class="primary" onclick="verificarOrdem()">Confirmar sequência</button>`;
app.innerHTML=`<div class="card">${topo(g)}<div class="badges"><span class="badge">${g.titulo}</span></div><h2>${g.q}</h2>${body}<div id="feedback"></div></div>`;
}

function responder(valor){
if(state.respondido)return;
const g=GAMES[state.fase];
let certo;
if(g.tipo==="quiz") certo=g.ops[valor][1];
else certo=valor===g.resposta;
finalizar(certo,g.exp);
}

function selecionar(i){
if(state.respondido)return;
if(state.selecionados.includes(i))return;
state.selecionados.push(i);
document.getElementById('b'+i).classList.add('selected');
}

function verificarOrdem(){
if(state.respondido)return;
const g=GAMES[state.fase];
const certo=state.selecionados.join(',')==="0,1,2,3";
finalizar(certo,g.exp);
}

function finalizar(certo,exp){
state.respondido=true;
if(certo){state.acertos++;state.pontos+=100}
document.querySelectorAll('.option').forEach(b=>b.disabled=true);
const fb=document.getElementById('feedback');
fb.className='feedback '+(certo?'good':'bad');
fb.innerHTML=`<b>${certo?'✅ Muito bem! +100 pontos':'❌ Ainda não. Vamos aprender com o erro.'}</b><p>${exp}</p><button class="next" onclick="proxima()">${state.fase===GAMES.length-1?'🏁 Ver resultado':'➡ Próximo desafio'}</button>`;
}

function proxima(){state.fase++;mostrar()}

function resultado(){
const nota=Math.round(state.acertos/GAMES.length*1000);
let msg=nota>=800?"🔥 Excelente! Você já está dominando a base.":nota>=600?"👏 Muito bom! Mais alguns treinos e você vai avançar bastante.":"💪 Bom começo! Revise a aula e tente novamente.";
app.innerHTML=`<div class="card result"><h2>🏆 Treino concluído!</h2><div class="bigscore">${nota}</div><p><b>Nota de treino</b></p><p>Você acertou <b>${state.acertos} de ${GAMES.length}</b> desafios e fez <b>${state.pontos} pontos</b>.</p><h3>${msg}</h3><div class="example"><b>Importante:</b> essa nota é apenas uma forma divertida de acompanhar o treino. Ela não representa a nota oficial do ENEM.</div><button class="primary" onclick="comecar()">🔁 Jogar novamente</button><button class="secondary" onclick="aula()">📖 Rever a aula</button><button class="secondary" onclick="home()">🏠 Início</button></div>`;
}
home();
</script>
</body>
</html>
