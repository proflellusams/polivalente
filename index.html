<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jornada rumo à Nota 1000 — Redação ENEM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#fffbeb}
.pop{animation:pop .25s}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt{transition:.15s}.opt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 4px 10px #0001}
</style>
</head>
<body class="text-slate-800 font-sans">
<header class="bg-teal-700 text-white shadow">
  <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
    <div class="font-extrabold text-lg sm:text-xl">🏆 Jornada rumo à <span class="text-amber-300">Nota 1000</span></div>
    <button onclick="home()" class="bg-white/20 hover:bg-white/30 rounded-lg px-3 py-1 text-sm font-semibold">🏠 Início</button>
  </div>
</header>
<main class="max-w-4xl mx-auto p-3 sm:p-6"><div id="app"></div>
<p class="text-center text-slate-400 text-xs mt-8">Material de estudo baseado na Matriz de Referência e na Cartilha do Participante (INEP). As notas e os níveis do jogo são apenas para treino.</p></main>

<script>
const $ = s => document.querySelector(s), app = $('#app');
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sh = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const KEY = 'enemJogosV2';
const ld = () => { try { return Object.assign({ name: '', best: {}, rank: [] }, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return { name: '', best: {}, rank: [] }; } };
const sv = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} };
const xp = D => Object.values(D.best).reduce((a, b) => a + b.p, 0);
const NIV = [[0, '🌱 Iniciante'], [1000, '✏️ Aprendiz'], [2500, '📝 Escritor(a)'], [4500, '🏆 Mestre da Redação']];
const view = h => { app.innerHTML = h; window.scrollTo(0, 0); };
const setName = v => { const D = ld(); D.name = v.trim().slice(0, 20); sv(D); };

const TEMA = 'Desafios para o uso consciente do celular e das redes sociais entre os jovens no Brasil';

/* ================= AULA RÁPIDA ================= */
const AULA = [
 { t: '📝 O que é a redação do ENEM?', h: `
  <p>É um texto <b>dissertativo-argumentativo</b>. Isso quer dizer que você <b>defende uma opinião</b> sobre um tema e usa <b>argumentos</b> para convencer quem lê.</p>
  <div class="grid grid-cols-3 gap-2 text-center my-3">
   <div class="bg-teal-50 rounded-xl p-3"><div class="text-2xl font-extrabold text-teal-700">1000</div><div class="text-xs">pontos no máximo</div></div>
   <div class="bg-teal-50 rounded-xl p-3"><div class="text-2xl font-extrabold text-teal-700">30</div><div class="text-xs">linhas no máximo</div></div>
   <div class="bg-teal-50 rounded-xl p-3"><div class="text-2xl font-extrabold text-teal-700">5</div><div class="text-xs">competências</div></div>
  </div>
  <p>O tema aparece na prova e você precisa falar <b>exatamente dele</b>. Texto com 7 linhas ou menos é considerado insuficiente.</p>
  <div class="bg-red-50 border border-red-300 rounded-xl p-3 mt-3 text-sm"><b>⚠️ O que zera a redação:</b> fugir totalmente do tema, não escrever um texto dissertativo-argumentativo ou escrever muito pouco.</div>` },
 { t: '🎯 As 5 competências', h: `
  <p class="mb-2">Cada competência vale até <b>200 pontos</b> (5 × 200 = 1000). Em palavras simples:</p>
  <ul class="space-y-2 text-sm">
   <li class="bg-teal-50 rounded-xl p-3"><b>C1 · Escrever bem:</b> usar o português correto (ortografia, concordância, crase, pontuação).</li>
   <li class="bg-teal-50 rounded-xl p-3"><b>C2 · Entender o tema:</b> falar do tema certo, seguir o formato da redação e usar <b>repertório</b> (conhecimento de fora do texto).</li>
   <li class="bg-teal-50 rounded-xl p-3"><b>C3 · Organizar as ideias:</b> ter uma opinião clara e defendê-la com argumentos bem explicados.</li>
   <li class="bg-teal-50 rounded-xl p-3"><b>C4 · Ligar as ideias:</b> usar conectivos (além disso, portanto...) para o texto fluir.</li>
   <li class="bg-teal-50 rounded-xl p-3"><b>C5 · Propor uma solução:</b> terminar com uma <b>proposta de intervenção</b> completa, que respeite os direitos humanos.</li>
  </ul>` },
 { t: '🧱 A estrutura: 4 parágrafos', h: `
  <p class="mb-2">Uma boa forma de começar é usar <b>4 parágrafos</b>:</p>
  <div class="space-y-2 text-sm">
   <div class="border-l-4 border-sky-500 bg-sky-50 rounded p-3"><b>1º · Introdução:</b> apresenta o tema e a sua opinião (a <b>tese</b>).</div>
   <div class="border-l-4 border-emerald-500 bg-emerald-50 rounded p-3"><b>2º · Desenvolvimento 1:</b> primeiro argumento, com <b>repertório</b> e explicação.</div>
   <div class="border-l-4 border-amber-500 bg-amber-50 rounded p-3"><b>3º · Desenvolvimento 2:</b> segundo argumento, <b>diferente</b> do primeiro.</div>
   <div class="border-l-4 border-rose-500 bg-rose-50 rounded p-3"><b>4º · Conclusão:</b> retoma a ideia e apresenta a <b>proposta de intervenção</b>.</div>
  </div>
  <p class="text-sm mt-3">Dica: use linguagem formal e evite “eu acho”, “tipo”, “né” e gírias.</p>` },
 { t: '💡 Tese e repertório', h: `
  <div class="bg-sky-50 rounded-xl p-3 mb-3 text-sm"><b>Tese</b> é a sua opinião sobre o tema, dita de forma clara. Exemplo: <i>“O uso exagerado do celular prejudica a saúde e os estudos dos jovens.”</i></div>
  <div class="bg-emerald-50 rounded-xl p-3 mb-3 text-sm"><b>Repertório</b> é um conhecimento de fora do texto que ajuda a provar a sua ideia. Ele precisa ser:
   <ul class="list-disc pl-5 mt-1"><li><b>Legitimado:</b> vem de uma fonte confiável;</li><li><b>Pertinente:</b> tem relação com o tema;</li><li><b>Produtivo:</b> você explica e usa na argumentação.</li></ul></div>
  <div class="grid grid-cols-2 gap-2 text-sm">
   <div class="bg-green-50 border border-green-300 rounded-xl p-3"><b>✅ Serve</b><br>dados do IBGE, leis, livros, filósofos, filmes, documentários e fatos históricos</div>
   <div class="bg-red-50 border border-red-300 rounded-xl p-3"><b>❌ Não serve</b><br>“todo mundo sabe”, ditados, “vi na internet”, histórias pessoais</div>
  </div>` },
 { t: '🔗 Conectivos: ligando as ideias', h: `
  <p class="mb-2">Conectivos são palavras que ligam uma ideia à outra. Cada um tem um papel. Escolher o errado atrapalha o texto (C4).</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
   <div class="bg-teal-50 rounded-xl p-3"><b>Somar ideias:</b><br>além disso, ademais, também</div>
   <div class="bg-teal-50 rounded-xl p-3"><b>Contrariar:</b><br>porém, contudo, entretanto</div>
   <div class="bg-teal-50 rounded-xl p-3"><b>Explicar a causa:</b><br>pois, porque, já que</div>
   <div class="bg-teal-50 rounded-xl p-3"><b>Mostrar a consequência:</b><br>por isso, assim, dessa forma</div>
   <div class="bg-teal-50 rounded-xl p-3 sm:col-span-2"><b>Concluir:</b> portanto, diante disso, em suma</div>
  </div>
  <p class="text-sm mt-3">Exemplo errado: “Ele estuda muito. <b>Entretanto</b>, tira boas notas.” As duas ideias se somam, então o certo é <b>“Por isso”</b>.</p>` },
 { t: '🛠️ Proposta de intervenção', h: `
  <p class="mb-2">É a solução que você propõe no último parágrafo. Ela precisa de <b>5 itens</b>:</p>
  <div class="space-y-2 text-sm">
   <div class="bg-rose-50 rounded-xl p-2"><b>1. Agente (quem?):</b> o Ministério da Educação, as escolas, a mídia...</div>
   <div class="bg-rose-50 rounded-xl p-2"><b>2. Ação (o quê?):</b> criar oficinas sobre o uso consciente do celular.</div>
   <div class="bg-rose-50 rounded-xl p-2"><b>3. Meio (como?):</b> por meio de aulas e rodas de conversa.</div>
   <div class="bg-rose-50 rounded-xl p-2"><b>4. Finalidade (para quê?):</b> a fim de que os jovens usem a tecnologia com equilíbrio.</div>
   <div class="bg-rose-50 rounded-xl p-2"><b>5. Detalhamento:</b> uma informação extra, como “com a ajuda de psicólogos e professores”.</div>
  </div>
  <div class="bg-red-50 border border-red-300 rounded-xl p-3 mt-3 text-sm"><b>⚠️ Atenção:</b> propostas que desrespeitam os direitos humanos (por exemplo, punir ou excluir pessoas) zeram a C5. Evite também “o governo tem que resolver” sem dizer como.</div>` }
];

function aula(T) {
  const s = AULA[T], last = T === AULA.length - 1;
  view(`<div class="pop bg-white rounded-2xl shadow-lg p-5 sm:p-7">
    <div class="flex justify-center gap-2 mb-4">${AULA.map((_, i) => `<span class="h-2 w-6 rounded-full ${i === T ? 'bg-teal-600' : 'bg-slate-200'}"></span>`).join('')}</div>
    <p class="text-xs text-slate-500 mb-1">Aula rápida · ${T + 1} de ${AULA.length}</p>
    <h2 class="text-xl font-extrabold mb-3">${s.t}</h2>
    <div class="text-slate-700 leading-relaxed">${s.h}</div>
    <div class="flex gap-2 mt-6">
      <button onclick="${T ? 'aula(' + (T - 1) + ')' : 'home()'}" class="flex-1 bg-slate-200 hover:bg-slate-300 font-bold py-3 rounded-xl">${T ? '⬅ Voltar' : 'Início'}</button>
      <button onclick="${last ? 'home()' : 'aula(' + (T + 1) + ')'}" class="flex-1 ${last ? 'bg-amber-400 hover:bg-amber-500 text-slate-900' : 'bg-teal-600 hover:bg-teal-700 text-white'} font-extrabold py-3 rounded-xl">${last ? '🎮 Ir para os jogos' : 'Próximo ➜'}</button>
    </div></div>`);
}

/* ================= BANCO DE JOGOS ================= */

const ce = (txt, k, w) => ({ txt, o: EV, a: EK.indexOf(k), w });
const PL = ['Agente (quem?)', 'Ação (o quê?)', 'Meio (como?)', 'Finalidade (para quê?)', 'Detalhamento'];
const pp = (txt, a, w) => ({ txt, o: PL, a, w });

const GAMES = [

      w: 'Introdução primeiro, depois o argumento com repertório (um livro), o argumento novo com “Além disso” e, por fim, a proposta de intervenção.' }
   ] },

    { q: 'Complete a frase:', txt: 'Muitos jovens passam horas nas redes sociais. ____, dormem pouco e rendem menos na escola.', o: ['Por isso', 'Entretanto', 'Embora', 'Porque'], a: 0, w: 'O sono ruim é uma consequência do tempo nas redes. Para mostrar consequência, usamos “por isso”.' },

    pp('por meio de aulas e rodas de conversa', 2, 'Mostra de que modo a ação acontece. Isso é o meio.'),
    pp('a fim de que os jovens usem a tecnologia com equilíbrio', 3, 'Explica o objetivo da proposta. A finalidade responde “para quê?”.'),
    pp('com a ajuda de psicólogos e professores, que orientarão os alunos', 4, 'Acrescenta uma informação extra sobre a ação. Isso é o detalhamento.'),
    pp('por meio de campanhas educativas na televisão e na internet', 2, 'Mostra de que modo a ação será feita. Isso é o meio.')
   ] }
];

let G = null, S = null;

/* ================= TELAS ================= */
function rankHTML(hl) {
  const r = ld().rank;
  if (!r.length) return '<p class="text-slate-500 text-sm text-center py-3">Ainda não há pontuações. Jogue e seja o primeiro!</p>';
  return '<ol class="space-y-1">' + r.map((e, i) => `<li class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm ${hl === e.id ? 'bg-amber-100 border border-amber-400 font-bold' : 'bg-slate-50'}">
    <span class="w-7 text-center">${['🥇', '🥈', '🥉'][i] || (i + 1) + 'º'}</span><span class="flex-1 truncate">${esc(e.n)}</span>
    <span>${esc(e.g)}</span><span class="text-xs text-slate-500 hidden sm:inline">${esc(e.d)}</span><span class="text-teal-700 font-semibold">${e.s} pts</span></li>`).join('') + '</ol>';
}

function home() {
  G = S = null;
  const D = ld(), x = xp(D), ni = NIV.filter(n => x >= n[0]).length - 1, nx = NIV[ni + 1];
  const pc = nx ? Math.round((x - NIV[ni][0]) / (nx[0] - NIV[ni][0]) * 100) : 100;
  view(`<div class="pop">
   <div class="bg-white rounded-2xl shadow p-4 sm:p-5 mb-4 grid sm:grid-cols-2 gap-4">
    <div>
     <label class="text-sm font-semibold" for="nome">Seu nome no ranking</label>
     <input id="nome" maxlength="20" value="${esc(D.name)}" oninput="setName(this.value)" placeholder="Ex.: Maria S." class="w-full border-2 border-slate-200 rounded-xl px-3 py-2 mt-1 focus:outline-none focus:border-teal-500">
    </div>
    <div>
     <div class="flex justify-between text-sm font-bold"><span>${NIV[ni][1]}</span><span class="text-teal-700">${x} XP</span></div>
     <div class="w-full bg-slate-200 rounded-full h-3 mt-2"><div class="bg-gradient-to-r from-amber-400 to-teal-500 h-3 rounded-full" style="width:${pc}%"></div></div>
     <p class="text-xs text-slate-500 mt-1">${nx ? 'Faltam ' + (nx[0] - x) + ' XP para ' + nx[1] : 'Você chegou ao nível máximo!'}</p>
    </div>
   </div>
   <div class="bg-teal-600 text-white rounded-2xl p-4 sm:p-5 mb-4">
    <div class="text-xs uppercase tracking-wide opacity-80">Tema do treino</div>
    <div class="font-extrabold text-lg">${TEMA}</div>
   </div>
   <button onclick="aula(0)" class="w-full text-left bg-amber-300 hover:bg-amber-400 rounded-2xl p-4 mb-4 flex items-center gap-3 shadow">
    <span class="text-3xl">📖</span><span><b class="block">Aula rápida (comece por aqui!)</b><span class="text-sm">6 telas curtas para entender a redação do ENEM antes de jogar.</span></span>
   </button>
   <h2 class="font-extrabold text-lg mb-2">🎮 Escolha um jogo</h2>
   <div class="grid sm:grid-cols-2 gap-3 mb-6">${GAMES.map(g => {
     const b = D.best[g.id], st = b ? '⭐'.repeat(b.s) + '☆'.repeat(3 - b.s) : '☆☆☆';
     return `<button onclick="intro('${g.id}')" class="opt text-left bg-white border-l-8 ${g.cor} rounded-2xl shadow p-4">
       <div class="flex justify-between items-start"><span class="text-2xl">${g.i}</span><span class="text-sm">${st}</span></div>
       <b class="block mt-1">${g.n}</b><span class="text-sm text-slate-600">${g.d}</span>
       <span class="block text-xs text-slate-400 mt-1">${b ? 'Melhor: ' + b.p + ' pts' : 'Ainda não jogou'}</span></button>`;
   }).join('')}</div>
   <div class="bg-white rounded-2xl shadow p-4 sm:p-5">
    <h2 class="font-extrabold text-lg mb-2">🏅 Ranking (neste aparelho)</h2>${rankHTML()}
    <button onclick="if(confirm('Apagar o ranking e o progresso?')){const D=ld();D.rank=[];D.best={};sv(D);home()}" class="text-xs text-slate-400 hover:text-red-500 mt-3">Apagar ranking e progresso</button>
   </div></div>`);
}

function intro(id) {
  G = GAMES.find(g => g.id === id);
  view(`<div class="pop bg-white rounded-2xl shadow-lg p-5 sm:p-7 border-t-8 ${G.cor}">
   <div class="text-4xl mb-1">${G.i}</div><h2 class="text-2xl font-extrabold mb-3">${G.n}</h2>
   <div class="bg-sky-50 border border-sky-200 rounded-xl p-4 text-sm leading-relaxed mb-3"><b>📘 Antes de jogar:</b><br>${G.lic}</div>
   <ul class="text-sm text-slate-600 list-disc pl-5 mb-5"><li>Você tem <b>3 vidas</b> ❤️. Cada erro tira uma.</li><li>Acertos seguidos dão <b>bônus</b> 🔥.</li><li>Depois de cada resposta, leia o <b>porquê</b>: é assim que você aprende.</li></ul>
   <div class="flex gap-2"><button onclick="home()" class="flex-1 bg-slate-200 hover:bg-slate-300 font-bold py-3 rounded-xl">⬅ Voltar</button>
   <button onclick="begin()" class="flex-1 bg-amber-400 hover:bg-amber-500 font-extrabold py-3 rounded-xl">🚀 Começar</button></div></div>`);
}

function begin() { S = { i: 0, pts: 0, lives: 3, streak: 0, hit: 0, lock: false }; show(); }

function bar() {
  return `<div class="flex justify-between items-center text-sm font-bold mb-2"><span>${'❤️'.repeat(S.lives)}${'🖤'.repeat(3 - S.lives)}</span>
   <span class="text-orange-600">${S.streak >= 2 ? '🔥 x' + S.streak : ''}</span><span class="text-teal-700">⭐ ${S.pts} pts</span></div>
   <div class="w-full bg-slate-200 rounded-full h-3 mb-1"><div class="bg-gradient-to-r from-amber-400 to-emerald-500 h-3 rounded-full transition-all" style="width:${S.i / G.items.length * 100}%"></div></div>
   <p class="text-xs text-slate-500 mb-3">${G.i} ${G.n} · Rodada ${S.i + 1} de ${G.items.length}</p>`;
}

function show() {
  const it = G.items[S.i]; S.lock = false; S.mist = 0;
  if (G.t === 'order') { S.n = 0; S.ord = sh([0, 1, 2, 3]); return drawOrder(''); }
  let opts, cls;
  if (G.t === 'tf') { opts = [[G.tf[0], it.a === true], [G.tf[1], it.a === false]]; cls = 'grid grid-cols-2 gap-3'; }
  else { const idx = G.fix ? it.o.map((_, k) => k) : sh(it.o.map((_, k) => k)); opts = idx.map(k => [it.o[k], k === it.a]); cls = 'space-y-2'; }
  S.opts = opts;
  view(`<div class="pop bg-white rounded-2xl shadow-lg p-5 sm:p-7">${bar()}
   <h2 class="font-bold text-lg mb-3">${it.q || (G.t === 'tf' ? 'Esta afirmação está certa?' : 'Qual é o papel deste trecho na proposta?')}</h2>
   ${it.txt ? `<blockquote class="bg-amber-50 border-l-4 border-amber-400 rounded p-3 mb-4 italic">“${esc(it.txt)}”</blockquote>` : ''}
   <div class="${cls}">${opts.map((o, k) => `<button id="o${k}" onclick="pick(${k})" class="opt border-2 border-slate-200 rounded-xl p-3 text-sm font-medium bg-white ${G.t === 'tf' ? 'text-center font-bold' : 'text-left w-full'}">${esc(o[0])}</button>`).join('')}</div>
   <div id="fb"></div></div>`);
}

function pick(k) {
  if (S.lock) return; S.lock = true;
  const it = G.items[S.i], ok = S.opts[k][1], r = S.opts.findIndex(o => o[1]);
  S.opts.forEach((_, j) => { $('#o' + j).disabled = true; });
  $('#o' + r).className = 'border-2 border-emerald-500 bg-emerald-50 rounded-xl p-3 text-sm font-bold ' + (G.t === 'tf' ? 'text-center' : 'text-left w-full');
  if (ok) {
    S.streak++; S.hit++; const b = Math.min(S.streak - 1, 4) * 25; S.pts += 100 + b;
    fb(`<div class="bg-emerald-100 border border-emerald-400 rounded-xl p-3"><b>✅ Muito bem! +${100 + b} pontos</b><p class="text-sm mt-1"><b>Por quê?</b> ${esc(it.w)}</p></div>`);
  } else {
    S.streak = 0; S.lives--;
    $('#o' + k).className = 'border-2 border-red-500 bg-red-50 rounded-xl p-3 text-sm font-bold ' + (G.t === 'tf' ? 'text-center' : 'text-left w-full');
    fb(`<div class="bg-red-100 border border-red-400 rounded-xl p-3"><b>❌ Não foi dessa vez. Você perdeu 1 vida.</b><p class="text-sm mt-1">A resposta certa era: <b>${esc(S.opts[r][0])}</b>.</p><p class="text-sm mt-1"><b>Por quê?</b> ${esc(it.w)}</p></div>`);
  }
}

function drawOrder(msg) {
  const it = G.items[S.i], done = S.n === 4;
  const placed = it.p.slice(0, S.n).map((p, k) => `<div class="pop rounded-xl border-2 border-emerald-500 bg-emerald-50 p-3 text-sm"><b>${k + 1}º · ${p[0]}</b><br>${esc(p[1])}</div>`).join('');
  const left = S.ord.filter(k => k >= S.n).map(k => `<button onclick="tap(${k})" class="opt w-full text-left border-2 border-slate-200 rounded-xl p-3 text-sm bg-white">${esc(it.p[k][1])}</button>`).join('');
  view(`<div class="pop bg-white rounded-2xl shadow-lg p-5 sm:p-7">${bar()}
   <h2 class="font-bold text-lg mb-1">Toque nas partes na ordem certa</h2>
   <p class="text-xs bg-sky-50 border border-sky-200 rounded-lg p-2 mb-3">💡 Procure palavras-guia: “Além disso” aparece no 2º argumento e “Portanto” na conclusão.</p>
   ${msg ? `<div class="shake bg-red-100 border border-red-400 rounded-xl p-2 text-sm mb-3 font-semibold">${msg}</div>` : ''}
   <div class="space-y-2 mb-3">${placed}</div>
   ${done ? '' : `<p class="text-sm font-bold mb-2">Qual vem em ${S.n + 1}º lugar?</p><div class="space-y-2">${left}</div>`}
   <div id="fb"></div></div>`);
}

function tap(k) {
  if (S.lock) return;
  if (k === S.n) {
    S.n++; S.pts += 25;
    if (S.n === 4) {
      S.lock = true; S.pts += 50; if (!S.mist) S.hit++;
      drawOrder('');
      fb(`<div class="bg-emerald-100 border border-emerald-400 rounded-xl p-3"><b>✅ Redação montada! +50 pontos de bônus</b><p class="text-sm mt-1"><b>Por quê?</b> ${esc(G.items[S.i].w)}</p></div>`);
    } else drawOrder('');
  } else {
    S.mist = 1; S.lives--; S.streak = 0;
    if (S.lives <= 0) return end();
    drawOrder('❌ Essa parte não vem agora. Você perdeu 1 vida. Tente de novo!');
  }
}

function fb(h) {
  const last = S.lives <= 0 || S.i >= G.items.length - 1;
  $('#fb').innerHTML = `<div class="pop mt-4">${h}<button onclick="nxt()" class="mt-3 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl">${last ? 'Ver resultado 🏁' : 'Próxima ➜'}</button></div>`;
  $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nxt() { S.i++; (S.lives <= 0 || S.i >= G.items.length) ? end() : show(); }

function end() {
  const over = S.lives <= 0, pct = S.hit / G.items.length, stars = pct === 1 ? 3 : pct >= .7 ? 2 : pct >= .4 ? 1 : 0;
  const bonus = over ? 0 : S.lives * 50; S.pts += bonus;
  const D = ld(), id = Date.now(), b = D.best[G.id];
  if (!b || S.pts > b.p) D.best[G.id] = { p: S.pts, s: Math.max(stars, b ? b.s : 0) };
  else if (stars > b.s) b.s = stars;
  D.rank.push({ id, n: D.name || 'Anônimo', s: S.pts, g: G.i, d: new Date().toLocaleDateString('pt-BR') });
  D.rank.sort((a, c) => c.s - a.s); D.rank = D.rank.slice(0, 10); sv(D);
  const tit = over ? '😅 Acabaram as vidas. Tente de novo!' : stars === 3 ? '🏆 Perfeito! Você mandou muito bem!' : stars === 2 ? '🥇 Ótimo resultado!' : stars === 1 ? '🥈 Bom começo! Revise a aula e tente de novo.' : '💪 Continue treinando, você vai conseguir!';
  view(`<div class="pop bg-white rounded-2xl shadow-lg p-5 sm:p-7 text-center">
   <div class="text-5xl mb-1">${G.i}</div><h2 class="text-2xl font-extrabold mb-1">${tit}</h2>
   <div class="text-3xl my-2">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
   <p class="text-slate-600 mb-4">${esc(D.name || 'Jogador(a)')}, você acertou <b>${S.hit} de ${G.items.length}</b> rodadas${over ? ' e ficou sem vidas.' : ', com ' + S.lives + ' vida(s) sobrando (+' + bonus + ' pontos).'}</p>
   <div class="bg-teal-50 rounded-xl p-4 mb-4"><div class="text-4xl font-extrabold text-teal-700">${S.pts}</div><div class="text-xs">pontos nesta partida</div></div>
   <h3 class="font-bold text-left mb-2">🏅 Ranking</h3><div class="text-left">${rankHTML(id)}</div>
   <div class="flex flex-wrap gap-2 mt-5">
    <button onclick="intro('${G.id}')" class="flex-1 min-w-[140px] bg-amber-400 hover:bg-amber-500 font-extrabold py-3 rounded-xl">🔁 Jogar de novo</button>
    <button onclick="aula(0)" class="flex-1 min-w-[140px] bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl">📖 Rever a aula</button>
    <button onclick="home()" class="flex-1 min-w-[140px] bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-xl">🎮 Outros jogos</button>
   </div></div>`);
}

home();
</script>
</body>
</html>
