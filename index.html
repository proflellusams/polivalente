<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redação ENEM — Aprender e Jogar</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
button{font:inherit}
.wrap{max-width:1100px;margin:auto;padding:18px}
header{background:linear-gradient(135deg,#164e63,#0f766e);color:#fff;border-radius:25px;padding:30px;box-shadow:0 12px 30px #0002;margin-bottom:18px}
header h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}
header p{margin:0;line-height:1.5;max-width:800px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.nav button{border:0;background:#fff;padding:10px 13px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px #0001}
.card{background:#fff;border:1px solid #e1e7ee;border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 8px 25px #10203010}
h2{margin-top:0;color:#164e63}
h3{color:#0f766e}
p,li{line-height:1.65}
.lesson{border-left:6px solid #14b8a6;background:#f8fafc;padding:18px;border-radius:12px;margin:13px 0}
.simple{background:#ecfeff;border:1px solid #a5f3fc;border-radius:15px;padding:15px;margin:14px 0}
.example{background:#fffbeb;border-left:5px solid #f59e0b;padding:15px;border-radius:10px;margin:12px 0}
.warning{background:#fff1f2;border:1px solid #fecdd3;border-radius:14px;padding:15px}
.tip{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.game-card{border:2px solid #e2e8f0;border-radius:18px;padding:18px;background:#fff}
.game-card h3{margin-top:0}
.primary,.secondary,.choice,.word,.tile{border:0;border-radius:13px;padding:13px 16px;cursor:pointer;font-weight:700}
.primary{background:#0f766e;color:#fff}
.secondary{background:#e2e8f0;color:#172033}
.choice,.word,.tile{width:100%;text-align:left;background:#fff;border:2px solid #e2e8f0;margin:7px 0}
.choice:hover,.word:hover,.tile:hover{border-color:#0f766e}
.choice.correct,.word.correct,.tile.correct{border-color:#16a34a;background:#f0fdf4}
.choice.wrong,.word.wrong,.tile.wrong{border-color:#dc2626;background:#fff1f2}
.feedback{padding:15px;border-radius:14px;margin-top:15px}
.good{background:#ecfdf5;border:1px solid #86efac}
.bad{background:#fff1f2;border:1px solid #fda4af}
.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0}
.bar span{display:block;height:100%;background:#14b8a6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f8fafc;padding:12px;text-align:center;border-radius:14px}
.stat strong{display:block;font-size:24px;color:#0f766e}
.hidden{display:none}
.big{font-size:50px;font-weight:900;color:#0f766e;text-align:center}
@media(max-width:750px){.grid,.stats{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🧠 Redação ENEM: Entender para Escrever</h1>
<p>Um material feito para quem ainda está aprendendo. Primeiro você entende a ideia com exemplos simples. Depois escolhe um jogo específico para treinar.</p>
</header>
<div class="nav">
<button onclick="inicio()">🏠 Início</button>
<button onclick="aula('estrutura')">🧱 Estrutura</button>
<button onclick="aula('tese')">🎯 Tese</button>
<button onclick="aula('argumento')">🔎 Argumentos</button>
<button onclick="aula('conectivos')">🔗 Conectivos</button>
<button onclick="aula('repertorio')">📚 Repertório</button>
<button onclick="aula('intervencao')">🛠️ Intervenção</button>
<button onclick="menuJogos()">🎮 Jogos</button>
</div>
<div id="app"></div>
</div>

<script>
const app=document.getElementById('app');

const AULAS={
estrutura:{
titulo:"🧱 1. Estrutura da redação",
texto:`Pense na redação como uma casa. Uma casa precisa de partes organizadas para ficar firme. A redação também. Cada parágrafo tem uma função.`,
blocos:[
["Introdução","É a porta de entrada. Apresenta o assunto e mostra qual ideia você vai defender. Essa ideia principal é chamada de tese."],
["Desenvolvimento 1","Aqui você explica o primeiro motivo que sustenta sua opinião. Não basta afirmar: é preciso explicar."],
["Desenvolvimento 2","Apresenta outro motivo. O ideal é que ele acrescente uma ideia nova, em vez de repetir o primeiro."],
["Conclusão","Retoma o problema e apresenta uma solução. No ENEM, essa solução é chamada de proposta de intervenção."]
]},
tese:{
titulo:"🎯 2. Tese: o que você realmente pensa sobre o problema",
texto:`Tese parece uma palavra difícil, mas a ideia é simples: é a posição que você vai defender. Imagine que alguém pergunte: “Qual é o principal problema relacionado a esse tema?” Sua resposta, quando bem organizada, pode virar sua tese.`,
blocos:[
["Pergunta","Tema: uso excessivo do celular por adolescentes. Pergunta: qual problema esse hábito pode causar?"],
["Resposta fraca","“Celular é ruim.” É muito vaga. Não explica qual problema está sendo discutido."],
["Resposta melhor","“O uso excessivo do celular pode prejudicar o sono e a concentração dos adolescentes.” Agora existem duas ideias que podem virar argumentos."],
["Dica","Uma boa tese ajuda a planejar os dois parágrafos de desenvolvimento. Se você disser “sono e concentração”, já sabe dois caminhos para continuar."]
]},
argumento:{
titulo:"🔎 3. Argumento: não basta dizer, é preciso explicar",
texto:`Argumentar é responder à pergunta “por que isso acontece?” ou “como isso prejudica a sociedade?”. O aluno não precisa escrever palavras difíceis. Precisa fazer o leitor entender a relação entre sua ideia e o problema.`,
blocos:[
["Afirmação","“O uso excessivo do celular pode prejudicar os estudos.”"],
["Pergunta","Por que isso acontece?"],
["Explicação","“Quando o estudante passa várias horas alternando entre vídeos, mensagens e redes sociais, sobra menos tempo e atenção para as atividades escolares.”"],
["Resultado","Agora existe uma relação clara: uso excessivo → menos tempo/atenção → prejuízo aos estudos."]
]},
conectivos:{
titulo:"🔗 4. Conectivos: as pontes do texto",
texto:`Conectivos são palavras ou expressões que mostram a relação entre as ideias. Pense neles como placas de trânsito: uma placa mostra se você deve seguir, mudar de direção, parar ou tomar cuidado. No texto, o conectivo mostra ao leitor como uma ideia se relaciona com a outra.`,
blocos:[
["Somar","Além disso, também, ainda, da mesma forma. Usados quando você acrescenta uma ideia."],
["Contrastar","Porém, contudo, entretanto. Usados quando uma ideia faz oposição à anterior."],
["Explicar causa","Porque, pois, já que, visto que. Mostram motivo."],
["Mostrar consequência","Por isso, portanto, dessa forma, assim. Mostram resultado."],
["Exemplo","“O celular facilita a comunicação. Porém, o uso exagerado pode prejudicar o sono.” Aqui há contraste."]
]},
repertorio:{
titulo:"📚 5. Repertório: conhecimento que ajuda seu argumento",
texto:`Repertório é um conhecimento que você traz para fortalecer sua explicação. Ele não existe para deixar o texto “bonito”. Ele precisa ajudar a provar ou explicar sua ideia.`,
blocos:[
["Pode ser","Dados de pesquisas, leis, fatos históricos, livros, filmes, documentários, conceitos de pensadores e acontecimentos sociais conhecidos."],
["Não basta citar","Escrever apenas “Segundo uma pesquisa...” não é suficiente se você não explica o que aquela informação prova."],
["Exemplo","“Uma pesquisa sobre o uso de telas entre jovens mostra que o excesso pode estar relacionado a alterações no sono. Esse dado ajuda a mostrar que o problema não é apenas falta de disciplina, mas pode afetar a rotina e o bem-estar.”"],
["Regra simples","Pergunte: “Esse conhecimento tem relação com meu argumento? Eu expliquei por que ele é importante?”"]
]},
intervencao:{
titulo:"🛠️ 6. Proposta de intervenção: como transformar o problema em solução",
texto:`Na conclusão, você não precisa inventar uma solução milagrosa. Precisa apresentar uma proposta possível e bem explicada. Pense em uma pessoa ou instituição que poderia agir e diga exatamente o que ela poderia fazer.`,
blocos:[
["Quem?","Agente: escola, prefeitura, Ministério da Educação, família, meios de comunicação etc."],
["O quê?","Ação: realizar oficinas, criar campanhas, ampliar projetos, oferecer orientação etc."],
["Como?","Meio: palestras, redes sociais, atividades escolares, materiais informativos, parcerias etc."],
["Para quê?","Finalidade: reduzir o problema, orientar os jovens, melhorar a rotina etc."],
["Detalhamento","Acrescente uma informação que deixe a proposta mais concreta. Exemplo: indicar público, frequência ou conteúdo da ação."]
]}
};

const JOGOS=[
{nome:"Jogo 1 — Detetive da Tese",tipo:"quiz",sobre:"Aprender a identificar uma opinião clara.",
q:"Tema: uso excessivo do celular por adolescentes. Qual frase pode funcionar melhor como tese?",
ops:[
["O celular está presente na sociedade atual.",false],
["O uso excessivo do celular pode prejudicar o sono e a concentração dos adolescentes.",true],
["Existem celulares de diferentes marcas.",false],
["Muitos adolescentes possuem celular.",false]
],exp:"A frase apresenta uma posição clara e já aponta dois problemas que podem ser desenvolvidos: sono e concentração."},
{nome:"Jogo 2 — Argumento ou Frase Solta?",tipo:"quiz",sobre:"Diferenciar uma afirmação de uma ideia explicada.",
q:"Qual opção apresenta uma ideia acompanhada de explicação?",
ops:[
["O celular atrapalha os estudos.",false],
["O celular é muito usado pelos jovens.",false],
["O uso excessivo pode atrapalhar os estudos porque reduz o tempo de atenção dedicado às atividades escolares.",true],
["A tecnologia faz parte da nossa vida.",false]
],exp:"A resposta não apenas afirma. Ela explica como o problema pode acontecer."},
{nome:"Jogo 3 — Ponte das Ideias",tipo:"quiz",sobre:"Escolher conectivos pelo sentido.",
q:"“O celular pode ajudar nos estudos. ________, quando usado sem controle, também pode distrair o estudante.”",
ops:[["Portanto",false],["Porém",true],["Por isso",false],["Além disso",false]],
exp:"A segunda frase apresenta uma ideia contrária à primeira. Por isso, “porém” funciona melhor."},
{nome:"Jogo 4 — Repertório na Prática",tipo:"quiz",sobre:"Reconhecer conhecimento que pode fortalecer a argumentação.",
q:"Qual opção é um repertório mais adequado?",
ops:[
["Minha opinião é que isso acontece muito.",false],
["Todo mundo sabe que adolescente usa celular.",false],
["Um dado de pesquisa confiável sobre o tempo de uso de telas por adolescentes.",true],
["Meu amigo disse que celular faz mal.",false]
],exp:"O dado de uma fonte confiável pode ajudar a sustentar a argumentação, desde que seja relacionado e explicado."},
{nome:"Jogo 5 — Causa e Efeito",tipo:"quiz",sobre:"Construir raciocínio lógico.",
q:"Qual alternativa apresenta causa e consequência?",
ops:[
["Os jovens usam celular todos os dias.",false],
["O celular possui aplicativos diferentes.",false],
["O uso do celular até tarde pode reduzir o tempo de sono e prejudicar a atenção no dia seguinte.",true],
["Existem celulares caros e baratos.",false]
],exp:"A causa é usar o celular até tarde. As consequências são dormir menos e ter dificuldade de atenção."},
{nome:"Jogo 6 — Organize a Redação",tipo:"ordem",sobre:"Entender a função de cada parágrafo.",
q:"Clique nos blocos na ordem em que eles devem aparecer.",
blocos:["Introdução — tema e tese","Desenvolvimento 1 — primeiro argumento","Desenvolvimento 2 — segundo argumento","Conclusão — proposta de intervenção"],
exp:"A estrutura básica trabalhada aqui é introdução, desenvolvimento 1, desenvolvimento 2 e conclusão."},
{nome:"Jogo 7 — Verdadeiro ou Falso",tipo:"vf",sobre:"Verificar conhecimentos básicos.",
q:"“Uma conclusão completa pode simplesmente dizer: ‘O governo precisa resolver isso’.”",
resposta:false,exp:"Falso. A frase é vaga. É preciso explicar quem vai agir, o que será feito, como e com qual finalidade."},
{nome:"Jogo 8 — Qual solução é melhor?",tipo:"quiz",sobre:"Treinar proposta de intervenção.",
q:"Qual proposta é mais completa para o problema do uso excessivo do celular?",
ops:[
["É preciso melhorar essa situação.",false],
["Os adolescentes devem ter mais responsabilidade.",false],
["As escolas podem promover oficinas sobre uso consciente da tecnologia, com orientações sobre tempo de tela e sono, para ajudar os estudantes a equilibrar estudo e lazer.",true],
["O celular deveria ser proibido para todos os adolescentes.",false]
],exp:"A proposta apresenta agente, ação, meio/detalhamento e finalidade, além de ser mais concreta e possível."},
{nome:"Jogo 9 — Linguagem Formal",tipo:"quiz",sobre:"Identificar linguagem inadequada para a redação.",
q:"Qual frase deve ser evitada em uma redação formal?",
ops:[
["Além disso, o uso excessivo pode prejudicar a rotina escolar.",false],
["Nesse contexto, torna-se necessário orientar os estudantes.",false],
["Tipo, o celular acaba com tudo e é muito ruim, né?",true],
["Por isso, medidas educativas podem contribuir para reduzir o problema.",false]
],exp:"“Tipo” e “né” são marcas de linguagem informal. A redação deve usar linguagem adequada à situação formal."},
{nome:"Jogo 10 — Situação Real",tipo:"quiz",sobre:"Transformar uma situação cotidiana em argumento.",
q:"Ana fica até 2 horas da manhã nas redes sociais e chega cansada à escola. Qual argumento pode nascer dessa situação?",
ops:[
["As redes sociais têm muitos aplicativos.",false],
["O uso noturno e excessivo das redes pode prejudicar o sono e afetar a atenção durante as aulas.",true],
["Todos os adolescentes fazem isso.",false],
["A escola deveria acabar com a internet.",false]
],exp:"A situação fornece um exemplo concreto de causa e consequência que pode ser transformado em argumento."},
{nome:"Jogo 11 — Qual conclusão fecha melhor?",tipo:"quiz",sobre:"Aprender a concluir sem repetir tudo.",
q:"Qual frase funciona melhor como fechamento?",
ops:[
["Foi isso que eu quis dizer.",false],
["Portanto, é necessário promover o uso equilibrado da tecnologia para que seus benefícios não sejam prejudicados pelo excesso.",true],
["O celular existe e sempre existirá.",false],
["Não tenho mais nada para falar.",false]
],exp:"A frase retoma a ideia principal e aponta a necessidade de equilíbrio, encerrando o raciocínio."},
{nome:"Jogo 12 — Desafio Final",tipo:"quiz",sobre:"Reunir os conhecimentos.",
q:"Qual conjunto apresenta uma boa lógica para uma redação?",
ops:[
["Tema → opinião → argumentos explicados → conclusão com solução.",true],
["Tema → opinião → repetir a mesma frase → fim.",false],
["Tema → contar uma história pessoal → terminar sem solução.",false],
["Tema → usar palavras difíceis → repetir o tema.",false]
],exp:"A redação precisa ter organização. Você apresenta o tema, defende uma tese, desenvolve argumentos e conclui com uma proposta adequada."}
];

let jogoAtual=0,pontos=0,acertos=0,selecionados=[],travado=false;

function inicio(){
app.innerHTML=`
<div class="card">
<h2>👋 Como usar este material</h2>
<p>Este material foi pensado para alunos que ainda não dominam redação. Por isso, <b>não começa pelo jogo</b>. Primeiro explica a ideia com palavras simples e exemplos do cotidiano.</p>
<div class="simple"><b>Exemplo de pensamento:</b> “Se eu quero dizer que o celular prejudica os estudos, preciso explicar por quê. O que acontece com o estudante? Ele perde tempo? Dorme menos? Se distrai? É isso que transforma uma opinião em argumento.”</div>
<h3>📚 Parte 1 — Aprenda</h3>
<div class="grid">
${Object.keys(AULAS).map(k=>`<div class="game-card"><h3>${AULAS[k].titulo}</h3><p>${AULAS[k].texto}</p><button class="primary" onclick="aula('${k}')">Estudar este assunto</button></div>`).join('')}
</div>
</div>
<div class="card">
<h2>🎮 Parte 2 — Escolha o tipo de jogo</h2>
<p>Os jogos ficam <b>separados</b>. Assim você pode escolher apenas o tipo de treino que quer trabalhar em cada aula.</p>
<button class="primary" onclick="menuJogos()">Abrir menu de jogos</button>
</div>`;
}

function aula(k){
const a=AULAS[k];
app.innerHTML=`<div class="card">
<h2>${a.titulo}</h2>
<p>${a.texto}</p>
${a.blocos.map(b=>`<div class="lesson"><h3>${b[0]}</h3><p>${b[1]}</p></div>`).join('')}
<div class="tip"><b>🗣️ Pense como aluno:</b> você não precisa decorar palavras difíceis. Precisa entender a função daquela parte e conseguir explicar a ideia com clareza.</div>
<button class="primary" onclick="menuJogos()">🎮 Treinar este conteúdo</button>
<button class="secondary" onclick="inicio()">🏠 Voltar</button>
</div>`;
}

function menuJogos(){
app.innerHTML=`<div class="card">
<h2>🎮 Central de Jogos</h2>
<p>Escolha um tipo de desafio. Cada jogo trabalha uma habilidade diferente.</p>
<div class="grid">
<div class="game-card"><h3>🔍 Detetive da escrita</h3><p>Identifique tese, argumento e linguagem adequada.</p><button class="primary" onclick="iniciar(0)">Jogar</button></div>
<div class="game-card"><h3>🔗 Conectivos</h3><p>Treine as palavras que ligam as ideias.</p><button class="primary" onclick="iniciar(2)">Jogar</button></div>
<div class="game-card"><h3>📚 Repertório</h3><p>Aprenda a escolher conhecimento que fortalece o argumento.</p><button class="primary" onclick="iniciar(3)">Jogar</button></div>
<div class="game-card"><h3>🧩 Organização</h3><p>Monte a estrutura da redação na ordem correta.</p><button class="primary" onclick="iniciar(5)">Jogar</button></div>
<div class="game-card"><h3>🛠️ Proposta de intervenção</h3><p>Escolha soluções completas e possíveis.</p><button class="primary" onclick="iniciar(7)">Jogar</button></div>
<div class="game-card"><h3>🏆 Desafio completo</h3><p>Faça todos os desafios misturados.</p><button class="primary" onclick="iniciar(0,true)">Jogar tudo</button></div>
</div>
</div>`;
}

let lista=[];
function iniciar(indice,tudo=false){
lista=tudo?JOGOS:[JOGOS[indice],...JOGOS.slice(indice+1,Math.min(indice+4,JOGOS.length))];
jogoAtual=0;pontos=0;acertos=0;selecionados=[];mostrarJogo();
}

function mostrarJogo(){
if(jogoAtual>=lista.length){resultado();return}
travado=false;selecionados=[];
const g=lista[jogoAtual];
let body='';
if(g.tipo==="quiz")body=g.ops.map((o,i)=>`<button class="choice" onclick="responder(${i})">${o[0]}</button>`).join('');
if(g.tipo==="vf")body=`<div class="grid"><button class="choice" onclick="responder(true)">✅ Verdadeiro</button><button class="choice" onclick="responder(false)">❌ Falso</button></div>`;
if(g.tipo==="ordem")body=`<p class="small">Clique nos blocos na ordem correta.</p>${g.blocos.map((b,i)=>`<button class="tile" id="tile${i}" onclick="selecionar(${i})">${b}</button>`).join('')}<button class="primary" onclick="confirmarOrdem()">Confirmar</button>`;
app.innerHTML=`<div class="card">
<div class="stats"><div class="stat"><strong>${pontos}</strong>pontos</div><div class="stat"><strong>${acertos}</strong>acertos</div><div class="stat"><strong>${jogoAtual+1}</strong>/${lista.length}</div></div>
<div class="bar"><span style="width:${jogoAtual/lista.length*100}%"></span></div>
<div class="simple"><b>${g.nome}</b><br><span class="small">${g.sobre}</span></div>
<h2>${g.q}</h2>${body}<div id="fb"></div>
</div>`;
}

function responder(v){
if(travado)return;
const g=lista[jogoAtual];
let certo=g.tipo==="quiz"?g.ops[v][1]:v===g.resposta;
finalizar(certo,g.exp);
}
function selecionar(i){
if(travado||selecionados.includes(i))return;
selecionados.push(i);document.getElementById("tile"+i).classList.add("correct");
}
function confirmarOrdem(){finalizar(selecionados.join(",")==="0,1,2,3",lista[jogoAtual].exp)}
function finalizar(certo,exp){
travado=true;if(certo){pontos+=100;acertos++}
document.querySelectorAll(".choice,.tile").forEach(x=>x.disabled=true);
document.getElementById("fb").innerHTML=`<div class="feedback ${certo?'good':'bad'}"><b>${certo?'✅ Acertou! +100 pontos':'❌ Vamos entender o erro'}</b><p>${exp}</p><button class="primary" onclick="proximo()">${jogoAtual===lista.length-1?'🏁 Resultado':'➡ Próximo'}</button></div>`;
}
function proximo(){jogoAtual++;mostrarJogo()}
function resultado(){
const nota=Math.round(acertos/lista.length*1000);
app.innerHTML=`<div class="card"><h2>🏆 Resultado do treino</h2><div class="big">${nota}</div><p style="text-align:center"><b>Nota de treino</b></p><p style="text-align:center">Você acertou <b>${acertos} de ${lista.length}</b> desafios.</p><div class="tip"><b>O mais importante:</b> não olhe apenas para a pontuação. Leia a explicação de cada questão. É ela que transforma o jogo em aprendizagem.</div><button class="primary" onclick="menuJogos()">🎮 Escolher outro jogo</button><button class="secondary" onclick="inicio()">🏠 Início</button></div>`;
}
inicio();
</script>
</body>
</html>
